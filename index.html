<button id="help" aria-label="玩法说明">?</button>
<div id="helpBox">
  <div id="helpPanel">
    <h2>玩法说明</h2>
    <ul>
      <li>点击鼠标：从「67」处朝光标方向射出一颗子弹</li>
      <li>长按鼠标：持续射击，弹道跟随光标</li>
      <li>子弹飞出屏幕后自动消失</li>
    </ul>
  </div>
</div>
<script>
(function(){
  var bullet = document.getElementById('bullet');
  var help = document.getElementById('help');
  var helpBox = document.getElementById('helpBox');
  var SPEED = 1000;
  var FIRE_INTERVAL = 180;
  var flying = [];
  var cursor = { x: 0, y: 0 };
  var timer = null;
  var fingers = 0;

  function fire(){
    var r = bullet.getBoundingClientRect();
    var sx = r.left + r.width / 2;
    var sy = r.top + r.height / 2;
    var dx = cursor.x - sx, dy = cursor.y - sy;
    var d = Math.hypot(dx, dy);
    if (d < 2) return;
    var vx = dx / d * SPEED, vy = dy / d * SPEED;
    var img = document.createElement('img');
    img.src = bullet.src;
    img.style.cssText = 'position:fixed;left:0;top:0;width:' + r.width + 'px;pointer-events:none;z-index:10;';
    document.body.appendChild(img);
    flying.push({ img: img, x: sx - r.width / 2, y: sy - r.height / 2, w: r.width, h: r.height, vx: vx, vy: vy });
  }

  document.addEventListener('selectstart', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  document.addEventListener('pointerdown', function(e){
    if (e.button !== 0) return;
    if (e.target === help) return;
    if (helpBox.classList.contains('open')) return;
    cursor.x = e.clientX; cursor.y = e.clientY;
    fingers++;
    try { document.documentElement.setPointerCapture(e.pointerId); } catch (err) {}
    if (!timer){
      fire();
      timer = setInterval(fire, FIRE_INTERVAL);
    }
  });
  document.addEventListener('pointermove', function(e){
    cursor.x = e.clientX; cursor.y = e.clientY;
  });
  function stopFire(){
    fingers = 0;
    if (timer){ clearInterval(timer); timer = null; }
  }
  function lift(){
    fingers = Math.max(0, fingers - 1);
    if (fingers === 0) stopFire();
  }
  document.addEventListener('pointerup', lift);
  document.addEventListener('pointercancel', lift);
  window.addEventListener('blur', stopFire);

  help.addEventListener('click', function(e){
    e.stopPropagation();
    helpBox.classList.toggle('open');
  });
  helpBox.addEventListener('click', function(e){
    if (e.target === helpBox) helpBox.classList.remove('open');
  });

  var last = 0;
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000) || 0.016;
    last = now;
    var vw = innerWidth, vh = innerHeight;
    for (var i = flying.length - 1; i >= 0; i--){
      var b = flying[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x > vw || b.x + b.w < 0 || b.y > vh || b.y + b.h < 0){
        b.img.remove();
        flying.splice(i, 1);
      } else {
        b.img.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
